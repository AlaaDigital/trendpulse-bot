name: Post Trends Every 30 Minutes

on:
  schedule:
    - cron: '*/30 * * * *'  # كل 30 دقيقة
  workflow_dispatch:  # تقدر تشغله يدويا

jobs:
  post:
    runs-on: ubuntu-24.04  # ثابت باش ما يعطيكش تحذير ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # كان v4 - توا v5 يدعم Node 24
      
      - name: Set up Python
        uses: actions/setup-python@v6  # كان v5 - توا v6 يدعم Node 24
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Post trending topic with REAL image
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TREND_GEO: ${{ secrets.TREND_GEO }}
        run: |
          python facebook_poster.py
